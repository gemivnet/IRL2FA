<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 100">
  <!-- Background to simulate e-paper -->
  <rect width="300" height="100" fill="#f4f4f4" rx="2" ry="2"/>
  
  <!-- Top bar -->
  <text x="10" y="20" font-family="monospace" font-size="12" fill="#000000">1/3</text>
  <text x="150" y="20" font-family="monospace" font-size="12" text-anchor="middle" fill="#000000">TOTP VERIFY</text>
  <text x="290" y="20" font-family="monospace" font-size="12" text-anchor="end" fill="#000000">↑↓</text>
  
  <!-- Main code display -->
  <text x="150" y="65" font-family="monospace" font-size="36" text-anchor="middle" font-weight="bold" fill="#000000">284 751</text>
  
  <!-- Bottom bar -->
  <text x="150" y="85" font-family="monospace" font-size="14" text-anchor="middle" fill="#000000">github.com</text>
  
  <!-- Circular progress indicator -->
  <!-- Background circle -->
  <circle cx="280" cy="85" r="8" fill="none" stroke="#dddddd" stroke-width="1.5"/>
  
  <!-- Full progress circle -->
  <circle cx="280" cy="85" r="8" fill="none" stroke="#000000" stroke-width="1.5"/>
  
  <!-- Seconds text -->
  <text x="280" y="88" font-family="monospace" font-size="8" text-anchor="middle" fill="#000000">30</text>

  <!-- Border to simulate screen edges -->
  <rect width="298" height="98" x="1" y="1" fill="none" stroke="#000000" stroke-width="1" rx="2" ry="2"/>
</svg>