# Manufacturer land patterns and package dimensions for every footprint on
# the board. hardware/tests/test_footprints.py checks the footprints in
# hardware/irl2fa.kicad_pcb (as embedded, i.e. what gets fabricated) and
# their library copies against this table. A footprint used on the board
# with no entry here fails the test: adding a part means adding an entry.
#
# Coordinates: mm, KiCad footprint frame seen from the TOP (component side),
# x right, y DOWN, origin at the footprint anchor. Back-side footprints are
# un-mirrored before comparing. Datasheet drawings are rotated into this
# frame where needed (noted per entry); a rotation keeps the pin order, so
# pin 1 and the numbering direction are checked as drawn.
#
# Per entry:
#   datasheet / source  where every number comes from (URL + page/figure)
#   pads                manufacturer pads: num, at [x, y], size [w, h] (w along x),
#                       optional shape (circle) and drill [min, max]
#   rows                shorthand for a pad row: first, count, at (first pad), step, size
#   holes               non-plated holes: at, drill [min, max]
#   pin1                sign of pad 1's x and y (-1, 0, +1): which side/corner pin 1 is on
#   pitch               centre distance between two named pads
#                       (a list of them when pad 1 is several pads, e.g. a clip's two legs)
#   body                package body outline on F.Fab: size [w, h], at [x, y] (default 0, 0);
#                       curved: true checks the outline's extremes, for rounded sides
#   envelope            extra extents [x0, y0, x1, y1] the courtyard must enclose (lens, cell...)
#   edge_cuts           bounding box of the footprint's own Edge.Cuts graphics
#   tol                 per-dimension tolerances (mm), defaults below:
#     edge_out          how far any footprint pad edge may lie OUTSIDE the
#                       manufacturer pad's edge (bigger / shifted pad)
#     heel_out          like edge_out, for the pad edge facing the footprint
#                       centre (the heel, under the body); defaults to edge_out
#     edge_in           how far any footprint pad edge may lie INSIDE it
#                       (smaller / shifted pad). edge_in = edge_out = t means
#                       "centre and size within t".
#     hole_pos          hole / drilled pad position
#     pitch             pitch
#     body              body outline edges
#     courtyard         max courtyard margin beyond pads, body and envelope
#   Where a stock KiCad footprint (IPC-7351 generator) is larger than the
#   manufacturer's pattern, edge_out is widened and the reason is given in a
#   comment: those pads still cover the recommended land completely.
#
# SPDX-License-Identifier: CERN-OHL-S-2.0

defaults:
  tol: {edge_out: 0.05, edge_in: 0.05, hole_pos: 0.05, pitch: 0.02, body: 0.2, courtyard: 1.0}

footprints:

  # ------------------------------------------------------------------ custom (irl2fa.pretty)

  irl2fa:SW_Nav_Alps_SKRHABE010:
    part: Alps Alpine SKRHABE010 (LCSC C139794)
    datasheet: https://tech.alpsalpine.com/cms.media/product_catalog_mu_02_skrh_en_34aeb8c2e3.pdf
    source: >-
      SKRH catalog p.2, Drawing No.2 "Land Dimensions" (viewed from mounting face):
      signal pads span 8.5 outer / 5.8 inner in x, 3.85 / 1.85 in y, middle pad 1 high;
      frame tabs 2 wide, 9.9 / 6.3 spans; guide-boss holes 0.75 +0.1/0 and 1.05 +0.1/0,
      3.8 +-0.05 apart, small one on the pin-1 side (top). Pin numbers from the
      Dimensions view and circuit diagram: 1 A, 2 Center, 3 C (left), 4 B, 5 Common, 6 D (right).
      Body 7.35 x 7.5 (table x = 7.35).
    pads:
      - {num: "1", at: [-3.575, -1.425], size: [1.35, 1.0]}
      - {num: "2", at: [-3.575, 0], size: [1.35, 1.0]}
      - {num: "3", at: [-3.575, 1.425], size: [1.35, 1.0]}
      - {num: "4", at: [3.575, -1.425], size: [1.35, 1.0]}
      - {num: "5", at: [3.575, 0], size: [1.35, 1.0]}
      - {num: "6", at: [3.575, 1.425], size: [1.35, 1.0]}
      - {num: MP, at: [0, -4.05], size: [2.0, 1.8]}
      - {num: MP, at: [0, 4.05], size: [2.0, 1.8]}
    holes:
      - {at: [0, -1.9], drill: [0.75, 0.85]}
      - {at: [0, 1.9], drill: [1.05, 1.15]}
    pin1: [-1, -1]
    pitch: {pads: ["1", "2"], value: 1.425}
    body: {size: [7.35, 7.5]}

  irl2fa:Hirose_FH34SRJ-24S-0.5SH_1x24-1MP_P0.50mm_Horizontal:
    part: Hirose FH34SRJ-24S-0.5SH(50) (LCSC C324726)
    datasheet: https://datasheet.lcsc.com/datasheet/pdf/4fa13630ce538d3df6cea685e5f75b4e.pdf?productCode=C324726
    source: >-
      Hirose FH34SRJ catalog (Nov.1.2018) p.4 "Recommended PCB mounting pattern":
      signal pads 0.3 +-0.05 x 0.8 +-0.05 at 0.5 pitch, B = 11.5 for 24 pos; fitting
      nails 0.8 +-0.05 high, E = 13.1 / F = 13.9 +-0.1 (so 0.4 wide at x +-6.75);
      3.3 +-0.05 from the signal pads' outer edge to the nails' outer edge (nail
      centre y = -0.4 + 3.3 - 0.4 = 2.5). Contact No.1 on the right (p.3 top view).
      Body p.3: D = 13.38 +-0.1 wide, 3.8 deep (reference dimension, so the body
      position is checked loosely).
    rows:
      - {first: 1, count: 24, at: [5.75, 0], step: [-0.5, 0], size: [0.3, 0.8]}
    pads:
      - {num: MP, at: [-6.75, 2.5], size: [0.4, 0.8]}
      - {num: MP, at: [6.75, 2.5], size: [0.4, 0.8]}
    pin1: [1, 0]
    pitch: {pads: ["1", "2"], value: 0.5}
    body: {size: [13.38, 3.8], at: [0, 1.15]}
    tol: {body: 0.3}

  irl2fa:BatteryHolder_MYOUNG_MY-2450-01_CR2450:
    part: MYOUNG MY-2450-01, "CR2450-W" (LCSC C964845)
    datasheet: https://datasheet.lcsc.com/datasheet/pdf/26b02de8ee838f915c56d5652dea3d54.pdf?productCode=C964845
    source: >-
      MYOUNG drawing MY-CP-0106 rev A/0 (single sheet), "PCB Layout Diagram, Top View":
      pads 2-6.15 x 2-6.00, outer span 36.80, pad top 9.20 from the closed end and 8.00
      from the pad bottom to the open end (9.20 + 6.00 + 8.00 = the 23.20 +-0.3 plate
      depth). Top view: plate 25.50 +-0.3 wide, 23.20 deep, closed end 7.50 wide;
      height 5.70. Drawing tolerance X.XX +-0.20. Both legs are the + terminal (pad 1).
      The footprint origin is the cell centre, 12.50 from the closed end (a design
      choice: the cell rests against the 0.25 stop flap), so the pads sit at
      y = -12.50 + 9.20 + 3.00 = -0.30. Pad 2 (-) is our own 12.0 mm bare copper disc
      under the cell: the clip has no - contact (the cell's - face rests on the PCB),
      so it has no datasheet and is checked as designed, centred on the cell.
    pads:
      - {num: "1", at: [15.325, -0.3], size: [6.15, 6.0]}
      - {num: "1", at: [-15.325, -0.3], size: [6.15, 6.0]}
      - {num: "2", at: [0, 0], size: [12.0, 12.0], shape: circle}
    pin1: [[1, -1], [-1, -1]]                   # + on both legs, 0.3 towards the closed end
    body: {size: [25.5, 23.2], at: [0, -0.9], curved: true}   # lobed open end
    envelope: [-12.25, -12.25, 12.25, 12.25]   # the CR2450 cell
    tol: {body: 0.3}

  irl2fa:LED_Vishay_VSMB2948SL_SideView:
    part: Vishay VSMB2948SL (LCSC C6604342)
    datasheet: https://www.vishay.com/docs/83498/vsmb2948sl.pdf
    source: >-
      Doc 83498 rev 1.1 p.5, drawing 6.544-5410.02-4: "Solder pad proposal acc. IPC 7351"
