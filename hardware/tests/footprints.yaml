      Cathode left; with the lens facing -y that puts K at +x (pad 1) and A at -x.
      Body 2.2 wide x 1.6 deep, 2.55 including the lens; untoleranced dims +-0.2.
      The body's y offset from the pads is not dimensioned (Fab: y -0.42..+1.18),
      so it is checked within the drawing's +-0.2 only.
    pads:
      - {num: "1", at: [1.65, 0], size: [0.9, 1.2]}
      - {num: "2", at: [-1.65, 0], size: [0.9, 1.2]}
    pin1: [1, 0]
    body: {size: [2.2, 1.6], at: [0, 0.38]}
    envelope: [-0.9, -1.37, 0.9, 1.18]          # lens tip 2.55 from the body back
    tol: {body: 0.2}

