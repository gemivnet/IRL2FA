      - {num: "2", at: [-0.6, -0.45], size: [0.8, 0.5]}
      - {num: "3", at: [-0.6, 0.45], size: [0.8, 0.5]}
      - {num: "4", at: [-0.6, 1.35], size: [0.8, 0.5]}
      - {num: "5", at: [0.6, 1.35], size: [0.8, 0.5]}
      - {num: "6", at: [0.6, 0.45], size: [0.8, 0.5]}
      - {num: "7", at: [0.6, -0.45], size: [0.8, 0.5]}
      - {num: "8", at: [0.6, -1.35], size: [0.8, 0.5]}
    pin1: [-1, -1]
    pitch: {pads: ["1", "2"], value: 0.9}
    body: {size: [1.5, 3.2]}
    tol: {edge_out: 0.15, edge_in: 0.05, body: 0.1}

  Package_TO_SOT_SMD:SOT-23:
    part: AOS AO3401A (LCSC C15127), AO3400A (LCSC C20917); Nexperia NX3008NBK (LCSC C179399)
    datasheet: https://www.aosmd.com/sites/default/files/res/package/SOT23.pdf
    source: >-
      AOS "SOT23 Package Outline" PO-00001 rev N, "Recommended land pattern": pads
      0.80 x 0.80, 0.95 from the centre line (e1 = 1.90), rows 2.40 apart; pins 1, 2 on
      one side, 3 opposite. Rotated +90 deg into KiCad's orientation (1, 2 on the left).
      Body D 2.90 x E1 1.60 (+-0.2). Pinout G-S-D from the AO3401A/AO3400A datasheets p.1.
      KiCad's IPC pads are 1.475 x 0.6 at x +-0.9375: they reach 0.6 further in under
      the body (heel) and are 0.1 narrower each side than AOS's 0.8 (still wider than the
      0.5 max lead). Accepted: heel_out 0.65, edge_out 0.1 elsewhere, edge_in 0.1.
      NX3008NBK (Q3): Nexperia data sheet (5 Nov 2022) Fig. 19 "Reflow soldering footprint
      for SOT23": lands 0.6 x 0.7, 1.9 pitch, rows 2.0 apart, i.e. x 0.65..1.35 from the
      centre line after the same rotation. KiCad's pads (x 0.2..1.675, 0.6 wide) cover
      them completely; the AOS pattern above is the stricter of the two, so it is the one
      checked. Pinout G-S-D (NX3008NBK Table 2) as the AOS parts.
    pads:
      - {num: "1", at: [-1.2, -0.95], size: [0.8, 0.8]}
      - {num: "2", at: [-1.2, 0.95], size: [0.8, 0.8]}
      - {num: "3", at: [1.2, 0], size: [0.8, 0.8]}
    pin1: [-1, -1]
    pitch: {pads: ["1", "2"], value: 1.9}
    body: {size: [1.6, 2.9]}
    tol: {edge_out: 0.1, heel_out: 0.65, edge_in: 0.1, body: 0.2}

