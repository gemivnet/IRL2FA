  Package_DFN_QFN:UFQFPN-32-1EP_5x5mm_P0.5mm_EP3.5x3.5mm:
    part: ST STM32U083KCU6, UFQFPN32 (LCSC C22459164)
    datasheet: https://www.st.com/resource/en/datasheet/stm32u083kc.pdf
    datasheet_copy: https://datasheet.lcsc.com/datasheet/pdf/1d8e3bb2642efa1578790415a746a5f0.pdf?productCode=C22459164
    source: >-
      DS14463 rev 2, section 7.2 (UFQFPN32, A0B8): Figure 35 "recommended footprint"
      (p.107): pads 0.25 x 0.65, 0.5 pitch, 5.50 outer span (centres at +-2.425),
      exposed pad 3.60 x 3.60; pin 1 top-left, counter-clockwise (left column 1-8 down,
      bottom row 9-16, right column 17-24 up, top row 25-32 right to left). Table 89:
      body 5.00 BSC, exposed pad D2/E2 3.50-3.70 (aaa = 0.15).
      KiCad's IPC-7351 pattern makes the pads 0.875 long (2.0..2.875 from centre against
      ST's 2.1..2.75: 0.125 more toe, 0.1 more heel) and the EP 3.5 (D2 min) against
      ST's 3.6: accepted, the pads cover ST's land and the EP covers the smallest
      package EP. Hence edge_out 0.15 and EP edge_in 0.05.
    rows:
      - {first: 1, count: 8, at: [-2.425, -1.75], step: [0, 0.5], size: [0.65, 0.25]}
      - {first: 9, count: 8, at: [-1.75, 2.425], step: [0.5, 0], size: [0.25, 0.65]}
      - {first: 17, count: 8, at: [2.425, 1.75], step: [0, -0.5], size: [0.65, 0.25]}
      - {first: 25, count: 8, at: [1.75, -2.425], step: [-0.5, 0], size: [0.25, 0.65]}
    pads:
      - {num: "33", at: [0, 0], size: [3.6, 3.6], exposed: true}
    pin1: [-1, -1]
    pitch: {pads: ["1", "2"], value: 0.5}
    body: {size: [5.0, 5.0]}
    tol: {edge_out: 0.15, edge_in: 0.05, body: 0.15}

  Package_SON:MicroCrystal_C7_SON-8_1.5x3.2mm_P0.9mm:
