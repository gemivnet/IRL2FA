      - {num: "3", at: [0, 0.635], size: [0.787, 0.787], shape: circle}
      - {num: "4", at: [0, -0.635], size: [0.787, 0.787], shape: circle}
      - {num: "5", at: [1.27, 0.635], size: [0.787, 0.787], shape: circle}
      - {num: "6", at: [1.27, -0.635], size: [0.787, 0.787], shape: circle}
    holes:
      - {at: [-2.54, 0], drill: [0.915, 1.067]}
      - {at: [2.54, -1.016], drill: [0.915, 1.067]}
      - {at: [2.54, 1.016], drill: [0.915, 1.067]}
    no_paste: true
    pin1: [-1, 1]
    pitch: {pads: ["1", "3"], value: 1.27}
    tol: {edge_out: 0.076, edge_in: 0.076, hole_pos: 0.025}

  MountingHole:MountingHole_2.2mm_M2_Pad:
    part: M2 screw (no part)
    datasheet: https://www.iso.org/standard/4171.html
    source: >-
      ISO 273 clearance holes for M2: fine 2.2, medium 2.4. The 4.4 copper ring is a
      design choice (covers an ISO 7380 / ISO 4762 M2 head, 3.5 / 3.8 dia); no datasheet.
    pads:
      - {num: "1", at: [0, 0], size: [4.4, 4.4], shape: circle, drill: [2.2, 2.4]}
    pin1: [0, 0]

  TestPoint:TestPoint_Pad_D1.5mm:
    part: probe pad (no part)
    datasheet: none
    source: >-
      Design choice, no datasheet: 1.5 mm round SMD pad for a probe or pogo pin (VBAT
      current measurement, GND, and the five-pad programming row TP1-TP5 on a 2.54 mm
      grid; JLCPCB's programming fixtures want pads of 1.0 mm or more).
    pads:
      - {num: "1", at: [0, 0], size: [1.5, 1.5], shape: circle}
    pin1: [0, 0]

# Pin functions per part, from the datasheet pinouts, compared with the
# schematic symbols' pin names in the netlist (normalised: ~{INT} -> INT).
# The STM32U083 pins are checked against hardware/pins.yaml instead.
parts:
  RV-3032-C7:     # Micro Crystal RV-3032-C7 datasheet v1.4 p.2 "PIN CONNECTIONS"
    {"1": VBACKUP, "2": SDA, "3": INT, "4": EVI, "5": VSS, "6": VDD, "7": CLKOUT, "8": SCL}
  AO3401A:        # AOS AO3401A datasheet p.1 (SOT23 top view): G 1, S 2, D 3
    {"1": G, "2": S, "3": D}
  AO3400A:        # AOS AO3400A datasheet p.1
    {"1": G, "2": S, "3": D}
  NX3008NBK:      # Nexperia NX3008NBK data sheet Table 2 (SOT23): G 1, S 2, D 3
    {"1": G, "2": S, "3": D}
  MBR0530:        # cathode bar = pad 1 (K)
    {"1": K, "2": A}
  VSMB2948SL:     # Vishay doc 83498 p.5: cathode / anode
    {"1": K, "2": A}
  VEMT2023SLX01:  # Vishay doc 84166 p.4: collector / emitter
    {"1": C, "2": E}
  SKRHABE010:     # Alps SKRH Drawing No.2 circuit diagram
    {"1": A, "2": CENTER, "3": C, "4": B, "5": COMMON, "6": D}
  CR2450:         # MYOUNG MY-CP-0138: terminal + = pad 1, - = pad 2
    {"1": "+", "2": "-"}

# The e-paper's FPC pins (GDEY0213B74 datasheet p.7 pin table) land on J1's
# pins with the same numbers: checks J1's nets against the panel's pin names.
panel:
  ref: J1
  source: GDEY0213B74 datasheet p.7, pin table (1 NC .. 24 VCOM)
  pins:
    "1": [NC, null]
    "2": [GDR, EPD_GDR]
    "3": [RESE, EPD_RESE]
    "4": [NC, null]
    "5": [VSH2, EPD_VSH2]
    "6": [TSCL, null]
    "7": [TSDA, null]
    "8": [BS1, GND]          # BS1 low = 4-wire SPI
    "9": [BUSY, EPD_BUSY]
    "10": [RES#, EPD_RST]
    "11": [D/C#, EPD_DC]
    "12": [CS#, EPD_CS]
    "13": [SCL, EPD_SCK]
    "14": [SDA, EPD_SDI]
    "15": [VDDIO, VEPD]
    "16": [VCI, VEPD]
    "17": [VSS, GND]
    "18": [VDD, EPD_VDD]
    "19": [VPP, null]
    "20": [VSH1, EPD_VSH1]
    "21": [VGH, EPD_PREVGH]
    "22": [VSL, EPD_VSL]
    "23": [VGL, EPD_PREVGL]
    "24": [VCOM, EPD_VCOM]
