# JLCPCB's own footprints for the parts whose orientation matters, used by
# test_assembly.py to place them the way JLCPCB will (from irl2fa-cpl-jlcpcb.csv)
# and check every pad lands on ours.
#
# Source: the EasyEDA/LCSC library footprint JLCPCB assembles each LCSC part with
# (JLCEDA/EasyEDA official library, https://easyeda.com, https://lceda.cn),
# fetched from https://easyeda.com/api/products/<LCSC>/components on 2026-10-30.
# Pad centres only, in mm, footprint origin at (0, 0), y UP, unrotated, seen from
# the part's own top side (EasyEDA stores 10 mil units with y down; converted).
# pad_map: their pad number -> ours where the numbering differs.
# toward_top_edge: a direction in their frame that must end up pointing at the
# board's top (IR) edge, for parts whose pads are symmetric.
#
# C6604342 (VSMB2948SL, D4) and C7427088 (ANR3015, L1) have no EasyEDA footprint
# (the API answers 404, again on 2026-10-30); D4 is checked against C511451's (the
# VEMT2523SLX01, no longer fitted), the same Vishay side-view package, as an
# assumption (docs/assembly-review.md A-05). Note that EasyEDA draws the VEMT2023SLX01
# (C2843576, now Q5) the other way round from the VEMT2523SLX01: the same package can
# appear either way in JLCPCB's library, which is why D4 stays on the preview checklist.
# SPDX-License-Identifier: CERN-OHL-S-2.0
parts:
  C964845:
    refs: BT1
    footprint: BAT-SMD_MY-2450-01
    body: closed (chamfered) end of the clip at +y; the cell enters from -y
    toward_top_edge: [0, 1]
    pads:
      - ["1", -15.325, 0]
      - ["1", 15.325, 0]
      - ["2", 0, 0]
